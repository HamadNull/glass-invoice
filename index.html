<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة قياسات زجاج</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --primary: #0e7490;
    --text: #1e293b;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 20px;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
  }
  input, textarea {
    user-select: text;
    -webkit-user-select: text;
  }
  .app {
    max-width: 1200px;
    margin: auto;
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h1, h2 { margin-top: 0; }
  .header-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  label {
    display: flex;
    flex-direction: column;
    font-size: 14px;
    font-weight: 600;
    gap: 4px;
  }
  input, select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .quick-add {
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid #e2e8f0;
  }
  .add-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    align-items: end;
  }
  .qty-stepper {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .qty-stepper button {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 18px;
    cursor: pointer;
  }
  .qty-stepper input {
    width: 60px;
    text-align: center;
  }
  .btn-add {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
    height: 38px;
  }
  .btn-add:hover { background: #0b5e75; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 8px;
    text-align: center;
    font-size: 14px;
  }
  th { background: #e2e8f0; font-weight: 700; }
  tfoot td { background: #f1f5f9; font-weight: 700; }
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
  }
  .summary strong { color: var(--primary); }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .actions button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
  }
  .actions button:first-child {
    background: var(--primary);
    color: #fff;
  }
  .actions button:not(:first-child) {
    background: #e2e8f0;
    color: #1e293b;
  }
  .watermark {
    position: fixed;
    bottom: 8px;
    left: 8px;
    font-size: 11px;
    color: #94a3b8;
    pointer-events: none;
    user-select: none;
  }
  @media print {
    body { background: #fff; padding: 0; user-select: auto; }
    .app { box-shadow: none; padding: 0; max-width: 100%; }
    .no-print { display: none !important; }
    table { font-size: 12px; }
    th, td { padding: 4px; }
    .header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .summary { grid-template-columns: 1fr 1fr; }
    @page { size: A4; margin: 10mm; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="invoice-header">
    <h1>فاتورة قياسات زجاج</h1>
    <div class="header-grid">
      <label>اسم المحل <input id="shopName" placeholder="مثال: محل النور للزجاج"></label>
      <label>الفني / صاحب المحل <input id="techName" placeholder="اسم الفني"></label>
      <label>اسم الزبون <input id="customerName" placeholder="اسم الزبون"></label>
      <label>رقم الهاتف <input id="phone" placeholder="07XXXXXXXXX"></label>
      <label>التاريخ <input type="date" id="date"></label>
    </div>
  </header>

  <section class="quick-add no-print">
    <h2>إدخال سريع</h2>
    <div class="add-row">
      <div class="field">
        <label>الطول (سم)</label>
        <input type="number" id="length" step="0.1" min="0" placeholder="مثال: 104">
      </div>
      <div class="field">
        <label>العرض (سم)</label>
        <input type="number" id="width" step="0.1" min="0" placeholder="مثال: 29">
      </div>
      <div class="field">
        <label>العدد</label>
        <div class="qty-stepper">
          <button type="button" onclick="changeQty(-1)">-</button>
          <input type="number" id="qty" value="1" min="1" step="1">
          <button type="button" onclick="changeQty(1)">+</button>
        </div>
      </div>
      <div class="field">
        <label>البيان (اختياري)</label>
        <input type="text" id="desc" placeholder="داخل / واجهة / إضافي...">
      </div>
      <button type="button" class="btn-add" onclick="addItem()">إضافة والتالي</button>
    </div>
  </section>

  <section class="table-section">
    <table id="itemsTable">
      <thead>
        <tr>
          <th>#</th>
          <th>البيان</th>
          <th>الطول (سم)</th>
          <th>العرض (سم)</th>
          <th>العدد</th>
          <th>مساحة القطعة (سم²)</th>
          <th>فوت القطعة</th>
          <th>إجمالي الفوت</th>
          <th class="no-print">حذف</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="4">الإجمالي</td>
          <td id="totalQty">0</td>
          <td id="totalArea">0</td>
          <td></td>
          <td id="totalFoot">0.0000</td>
          <td class="no-print"></td>
        </tr>
      </tfoot>
    </table>
  </section>

  <section class="summary">
    <div>إجمالي القطع: <strong id="sumQty">0</strong></div>
    <div>إجمالي الفوت الدقيق: <strong id="sumFoot">0.0000</strong></div>
    <div>الفوت مقرب لأقرب نصف فوت للأعلى: <strong id="sumFootCeil">0.00</strong></div>
    <div>سعر الفوت (اختياري): <input type="number" id="pricePerFoot" step="0.01" placeholder="مثال: 5000" style="width:120px"></div>
    <div>التكلفة الإجمالية: <strong id="totalCost">0.00</strong></div>
  </section>

  <div class="actions no-print">
    <button onclick="printInvoice()">طباعة / حفظ PDF</button>
    <button onclick="clearAll()">مسح الكل</button>
    <button onclick="loadSample()">تحميل بيانات تجريبية</button>
  </div>
</div>

<div class="watermark">© محل الزجاج</div>

<script>
/* ========== حماية الكود ========== */
(function() {
  // منع كليك يمين
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // منع اختصارات لوحة المفاتيح
  document.addEventListener('keydown', function(e) {
    // F12
    if (e.key === 'F12' || e.keyCode === 123) {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+I / J / C / K
    if (e.ctrlKey && e.shiftKey && ['I','J','C','K'].includes(e.key.toUpperCase())) {
      e.preventDefault();
      return false;
    }
    // Ctrl+U (عرض المصدر)
    if (e.ctrlKey && !e.shiftKey && e.key.toUpperCase() === 'U') {
      e.preventDefault();
      return false;
    }
    // Ctrl+S (حفظ الصفحة)
    if (e.ctrlKey && !e.shiftKey && e.key.toUpperCase() === 'S') {
      e.preventDefault();
      return false;
    }
    // Ctrl+Shift+E (شبكة devtools)
    if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'E') {
      e.preventDefault();
      return false;
    }
    // Ctrl+A (تحديد الكل) - فقط خارج الحقول
    if (e.ctrlKey && e.key.toUpperCase() === 'A') {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        return false;
      }
    }
    // Ctrl+C (نسخ) - فقط خارج الحقول
    if (e.ctrlKey && e.key.toUpperCase() === 'C') {
      const tag = (e.target.tagName || '').toUpperCase();
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
        e.preventDefault();
        return false;
      }
    }
  });

  // منع السحب (drag)
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
    return false;
  });

  // منع السحب باللمس على الموبايل
  document.addEventListener('selectstart', function(e) {
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault();
      return false;
    }
  });
})();

/* ========== منطق الفاتورة ========== */
let items = [];
const tableBody = document.getElementById('tableBody');

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('glassItems');
  if (saved) {
    try {
      items = JSON.parse(saved);
      render();
    } catch (e) {}
  }
  document.getElementById('date').valueAsDate = new Date();

  document.getElementById('length').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('width').focus(); }
  });
  document.getElementById('width').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('qty').focus(); }
  });
  document.getElementById('qty').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });
  document.getElementById('desc').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });
  document.getElementById('pricePerFoot').addEventListener('input', updateCost);

  // حفظ بيانات الهيدر تلقائياً
  ['shopName','techName','customerName','phone'].forEach(id => {
    const el = document.getElementById(id);
    const savedVal = localStorage.getItem('glass_' + id);
    if (savedVal) el.value = savedVal;
    el.addEventListener('input', () => {
      localStorage.setItem('glass_' + id, el.value);
    });
  });
});

function addItem() {
  const length = parseFloat(document.getElementById('length').value);
  const width = parseFloat(document.getElementById('width').value);
  const qty = parseInt(document.getElementById('qty').value);
  const desc = document.getElementById('desc').value.trim() || '-';

  if (!length || !width || !qty || length <= 0 || width <= 0 || qty <= 0) {
    alert('الرجاء إدخال الطول والعرض والعدد بشكل صحيح.');
    return;
  }

  items.push({ desc, length, width, qty });
  render();

  document.getElementById('length').value = '';
  document.getElementById('width').value = '';
  document.getElementById('qty').value = 1;
  document.getElementById('desc').value = '';
  document.getElementById('length').focus();
}

function render() {
  tableBody.innerHTML = '';
  let totalQty = 0, totalArea = 0, totalFoot = 0;

  items.forEach((item, index) => {
    const area = item.length * item.width;
    const pieceFoot = area / 900;
    const itemFoot = pieceFoot * item.qty;

    totalQty += item.qty;
    totalArea += area * item.qty;
    totalFoot += itemFoot;

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${item.desc}</td>
      <td>${item.length}</td>
      <td>${item.width}</td>
      <td>${item.qty}</td>
      <td>${area.toFixed(2)}</td>
      <td>${pieceFoot.toFixed(4)}</td>
      <td>${itemFoot.toFixed(4)}</td>
      <td class="no-print">
        <button onclick="deleteItem(${index})" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;">حذف</button>
      </td>
    `;
    tableBody.appendChild(row);
  });

  document.getElementById('totalQty').textContent = totalQty;
  document.getElementById('totalArea').textContent = totalArea.toFixed(2);
  document.getElementById('totalFoot').textContent = totalFoot.toFixed(4);
  document.getElementById('sumQty').textContent = totalQty;
  document.getElementById('sumFoot').textContent = totalFoot.toFixed(4);

  const rounded = Math.ceil(totalFoot * 2) / 2;
  document.getElementById('sumFootCeil').textContent = rounded.toFixed(2);

  updateCost();
  localStorage.setItem('glassItems', JSON.stringify(items));
}

function deleteItem(index) {
  if (confirm('هل تريد حذف هذا البند؟')) {
    items.splice(index, 1);
    render();
  }
}

function changeQty(delta) {
  const qtyInput = document.getElementById('qty');
  let val = parseInt(qtyInput.value) || 1;
  val = Math.max(1, val + delta);
  qtyInput.value = val;
}

function updateCost() {
  const price = parseFloat(document.getElementById('pricePerFoot').value) || 0;
  const totalFoot = parseFloat(document.getElementById('sumFoot').textContent) || 0;
  const rounded = Math.ceil(totalFoot * 2) / 2;
  const cost = rounded * price;
  document.getElementById('totalCost').textContent = cost.toFixed(2);
}

function printInvoice() {
  window.print();
}

function clearAll() {
  if (confirm('هل تريد مسح جميع القياسات؟')) {
    items = [];
    render();
  }
}

function loadSample() {
  items = [
    { desc: 'داخل', length: 104, width: 29, qty: 3 },
    { desc: 'داخل', length: 49, width: 94, qty: 4 },
    { desc: 'داخل', length: 109, width: 105, qty: 2 },
    { desc: 'واجهة', length: 68, width: 74, qty: 3 },
    { desc: 'إضافي', length: 21, width: 148.5, qty: 2 },
    { desc: 'صورة 2', length: 90, width: 31, qty: 1 }
  ];
  render();
}
</script>
</body>
</html>
